openapi: 3.1.0
info:
  title: AEGIS Scanner
  version: 1.0.0
  description: Semgrep-as-a-service for the AEGIS agent fleet. Guild imports this spec as a custom integration.
servers:
  - url: https://REPLACE-WITH-TUNNEL.trycloudflare.com
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-AEGIS-Key
  schemas:
    Finding:
      type: object
      required: [rule_id, path, start_line, end_line, lines, message, severity, fingerprint]
      properties:
        rule_id: { type: string }
        path: { type: string }
        start_line: { type: integer }
        end_line: { type: integer }
        lines: { type: string, description: matched source lines }
        message: { type: string }
        severity: { type: string, enum: [ERROR, WARNING, INFO] }
        cwe: { type: string }
        fingerprint: { type: string, description: "stable id = sha1(rule_id, path, lines) truncated to 12 chars" }
        fix: { type: string, description: replacement code suggested by the rule, when available }
        fix_hint: { type: string, description: how to fix when no mechanical fix exists }
        seen_before: { type: integer, description: times this fingerprint was seen across the fleet (ClickHouse) }
        dismissed_before: { type: boolean, description: triage already marked this fingerprint a false positive }
        repo_mttr_h: { type: number, description: mean time to remediate in this repo, hours }
    ScanResult:
      type: object
      required: [repo, sha, verdict, findings, ms]
      properties:
        repo: { type: string }
        sha: { type: string }
        base_sha: { type: string }
        verdict: { type: string, enum: [safe, unsafe] }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        n_files: { type: integer }
        ms: { type: integer }
    VerifyLayer:
      type: object
      required: [name, passed, details, ms]
      properties:
        name: { type: string, enum: [static, regression, targeted_test] }
        passed: { type: boolean, nullable: true, description: "null = layer skipped (no test suite / no test_code), not required" }
        details: { type: string }
        ms: { type: integer }
    VerifyResult:
      type: object
      required: [verified, layers, summary, ms]
      properties:
        verified: { type: boolean, description: every non-skipped layer passed }
        repo: { type: string }
        base_sha: { type: string }
        head_sha: { type: string }
        fingerprint: { type: string }
        layers:
          type: array
          items: { $ref: '#/components/schemas/VerifyLayer' }
        summary: { type: string, description: "e.g. finding gone at 1a2b3c4; tests: 14 passed; regression test fails on base / passes on fix" }
        ms: { type: integer }
security:
  - apiKey: []
paths:
  /scan/diff:
    post:
      operationId: scan_diff
      summary: Scan only what a push introduced (Semgrep --baseline-commit). Answers "did this change make the repo unsafe?"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, base_sha, head_sha, agent]
              properties:
                repo: { type: string, description: owner/name }
                base_sha: { type: string, description: commit before the push }
                head_sha: { type: string, description: commit after the push }
                agent: { type: string, description: calling agent name, e.g. aegis-sentinel-01 }
      responses:
        '200':
          description: scan result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanResult' }
  /scan/full:
    post:
      operationId: scan_full
      summary: Scan every tracked file of a repo at a commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, sha, agent]
              properties:
                repo: { type: string }
                sha: { type: string }
                agent: { type: string }
      responses:
        '200':
          description: scan result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanResult' }
  /actions:
    post:
      operationId: record_action
      summary: Agent reports an action it took (stored in ClickHouse).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, repo, kind, ref]
              properties:
                agent: { type: string }
                repo: { type: string }
                kind: { type: string, enum: [status_set, issue_opened, issue_closed, pr_opened, pr_reviewed, dismissed, denied, email, verified, verify_failed] }
                ref: { type: string, description: issue/PR number, sha, or url }
                fingerprint: { type: string }
                latency_ms: { type: integer }
                session_url: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
  /status:
    post:
      operationId: set_status
      summary: Set the AEGIS commit status on a sha (success | failure | pending). The scanner calls GitHub, context "AEGIS / security-check".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, sha, state, agent]
              properties:
                repo: { type: string, description: owner/name }
                sha: { type: string, description: full commit sha }
                state: { type: string, enum: [success, failure, pending, error] }
                description: { type: string, description: "defaults to 'no new findings'; use '<n> new finding(s)' on failure" }
                target_url: { type: string, description: Guild session url or issue/PR url }
                agent: { type: string }
      responses:
        '200':
          description: result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  repo: { type: string }
                  sha: { type: string }
                  state: { type: string }
                  context: { type: string }
  /verify:
    post:
      operationId: verify_fix
      summary: Prove a fix is right. L1 the finding is gone at head_sha and no new findings vs base_sha (Semgrep). L2 the repo's own tests pass at head_sha. L3 your regression test FAILS at base_sha and PASSES at head_sha (a test that does not fail on the vulnerable code proves nothing). Call before opening or merging a fix PR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, base_sha, head_sha, agent]
              properties:
                repo: { type: string, description: owner/name }
                base_sha: { type: string, description: vulnerable commit (main before the fix) }
                head_sha: { type: string, description: commit with the fix (fix branch head) }
                fingerprint: { type: string, description: fingerprint of the finding being fixed }
                rule_id: { type: string }
                path: { type: string }
                agent: { type: string }
                test_code: { type: string, description: "pytest file source that exercises the vulnerability benignly, e.g. hits the endpoint with a quote character and asserts 200. Must fail on base_sha, pass on head_sha." }
                test_path: { type: string, description: "where to write test_code, default tests/test_aegis_<fingerprint>.py" }
      responses:
        '200':
          description: verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyResult' }
        '404':
          description: base_sha or head_sha cannot be checked out
  /insights:
    get:
      operationId: fleet_insights
      summary: Fleet-wide analytics from ClickHouse for the warden agent.
      parameters:
        - name: hours
          in: query
          schema: { type: integer, default: 24 }
      responses:
        '200':
          description: insights
          content:
            application/json:
              schema:
                type: object
                properties:
                  rising_repos: { type: array, items: { type: object } }
                  noisy_rules: { type: array, items: { type: object } }
                  reopened: { type: array, items: { type: object } }
                  agent_latency: { type: array, items: { type: object } }
