openapi: 3.1.0
info:
  title: AEGIS Scanner
  version: 1.3.0
  description: Semgrep-as-a-service for the AEGIS agent fleet. Guild imports this spec as a custom integration.
servers:
  - url: https://REPLACE-WITH-TUNNEL.trycloudflare.com
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-AEGIS-Key
  schemas:
    Finding:
      type: object
      required: [rule_id, path, start_line, end_line, lines, message, severity, fingerprint]
      properties:
        rule_id: { type: string }
        path: { type: string }
        start_line: { type: integer }
        end_line: { type: integer }
        lines: { type: string, description: matched source lines }
        message: { type: string }
        severity: { type: string, enum: [ERROR, WARNING, INFO] }
        cwe: { type: string }
        fingerprint: { type: string, description: "stable id = sha1(rule_id, path, lines) truncated to 12 chars" }
        fix: { type: string, description: replacement code suggested by the rule, when available }
        fix_hint: { type: string, description: how to fix when no mechanical fix exists }
        seen_before: { type: integer, description: times this fingerprint was seen across the fleet (ClickHouse) }
        dismissed_before: { type: boolean, description: triage already marked this fingerprint a false positive }
        repo_mttr_h: { type: number, description: mean time to remediate in this repo, hours }
        taint_rule_id: { type: string, description: "taint rule that also matched this line (its trace is attached) when a syntactic rule's id/fingerprint was kept" }
        trace_text: { type: string, description: "Semgrep's proven dataflow (--dataflow-traces) as one sentence: source -> propagators -> sink with file:line; only for taint rules. Quote it, do not infer the flow yourself." }
        dataflow_trace:
          type: array
          description: "steps of Semgrep's taint trace in order; only for taint rules"
          items:
            type: object
            required: [kind, path, line, code]
            properties:
              kind: { type: string, enum: [source, propagator, sink] }
              path: { type: string }
              line: { type: integer }
              code: { type: string }
    RuleGateResult:
      type: object
      required: [ok, validate_ok, test_ok, output, rule_id, errors, ms]
      properties:
        ok: { type: boolean, description: "true only when --validate and --test both pass; false => do not open the PR, fix the rule or fixture" }
        validate_ok: { type: boolean }
        test_ok: { type: boolean }
        output: { type: string, description: raw semgrep --validate and --test output; paste into the PR body }
        rule_id: { type: string }
        errors: { type: array, items: { type: string } }
        ms: { type: integer }
    ScanResult:
      type: object
      required: [repo, sha, verdict, findings, ms]
      properties:
        repo: { type: string }
        sha: { type: string }
        base_sha: { type: string }
        verdict: { type: string, enum: [safe, unsafe] }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        n_files: { type: integer }
        ms: { type: integer }
    VerifyLayer:
      type: object
      required: [name, passed, details, ms]
      properties:
        name: { type: string, enum: [static, regression, targeted_test] }
        passed: { type: boolean, nullable: true, description: "null = layer skipped (no test suite / no test_code), not required" }
        details: { type: string }
        ms: { type: integer }
    VerifyResult:
      type: object
      required: [verified, layers, summary, ms]
      properties:
        verified: { type: boolean, description: every non-skipped layer passed }
        repo: { type: string }
        base_sha: { type: string }
        head_sha: { type: string }
        fingerprint: { type: string }
        layers:
          type: array
          items: { $ref: '#/components/schemas/VerifyLayer' }
        summary: { type: string, description: "e.g. finding gone at 1a2b3c4; tests: 14 passed; regression test fails on base / passes on fix" }
        ms: { type: integer }
    FixResult:
      type: object
      required: [ok, replacement, new_content, diff, explanation, model, span, ms]
      properties:
        ok: { type: boolean, description: "false => do not commit; read error" }
        replacement: { type: string, description: text that replaced the span }
        new_content: { type: string, description: "full patched file; write it as-is with github create_or_update_file_contents (pass the file's sha)" }
        diff: { type: string, description: "unified diff a/<path> -> b/<path>; paste into the PR body" }
        explanation: { type: string }
        model: { type: string, description: "semgrep-rule-fix when the rule's fix was applied verbatim, else the OpenAI model name" }
        span:
          type: object
          properties:
            start_line: { type: integer }
            end_line: { type: integer }
        ms: { type: integer }
        error: { type: string }
        guard: { $ref: '#/components/schemas/GuardResult', description: "handoff guard: Semgrep scan of new_content against the original; ok=false with error 'patch rejected by Semgrep: <rules>' when the patch introduces a new finding" }
    GuardResult:
      type: object
      required: [clean, findings, rule_ids, bytes, ms, verdict_reason]
      properties:
        clean: { type: boolean, description: "false => do not hand this artifact on; rule_ids says why" }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        rule_ids: { type: array, items: { type: string }, description: blocking (ERROR/WARNING, not pre-existing) rule ids }
        bytes: { type: integer }
        ms: { type: integer }
        verdict_reason: { type: string }
        kind: { type: string }
        from_agent: { type: string }
        to_agent: { type: string }
        scanned: { type: boolean, description: false when the language has no Semgrep support (passed through) }
        sha: { type: string, description: sha1 of the content, 12 chars; same value recorded as the action fingerprint }
security:
  - apiKey: []
paths:
  /scan/diff:
    post:
      operationId: scan_diff
      summary: Scan only what a push introduced (Semgrep --baseline-commit). Answers "did this change make the repo unsafe?"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, base_sha, head_sha, agent]
              properties:
                repo: { type: string, description: owner/name }
                base_sha: { type: string, description: commit before the push }
                head_sha: { type: string, description: commit after the push }
                agent: { type: string, description: calling agent name, e.g. aegis-sentinel-01 }
      responses:
        '200':
          description: scan result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanResult' }
  /scan/full:
    post:
      operationId: scan_full
      summary: Scan every tracked file of a repo at a commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, sha, agent]
              properties:
                repo: { type: string }
                sha: { type: string }
                agent: { type: string }
      responses:
        '200':
          description: scan result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanResult' }
  /actions:
    post:
      operationId: record_action
      summary: Agent reports an action it took (stored in ClickHouse).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, repo, kind, ref]
              properties:
                agent: { type: string }
                repo: { type: string }
                kind: { type: string, enum: [status_set, issue_opened, issue_closed, pr_opened, pr_reviewed, dismissed, denied, email, verified, verify_failed, handoff_ok, handoff_rejected] }
                ref: { type: string, description: issue/PR number, sha, or url }
                fingerprint: { type: string }
                latency_ms: { type: integer }
                session_url: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
  /status:
    post:
      operationId: set_status
      summary: Set the AEGIS commit status on a sha (success | failure | pending). The scanner calls GitHub, context "AEGIS / security-check".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, sha, state, agent]
              properties:
                repo: { type: string, description: owner/name }
                sha: { type: string, description: full commit sha }
                state: { type: string, enum: [success, failure, pending, error] }
                description: { type: string, description: "defaults to 'no new findings'; use '<n> new finding(s)' on failure" }
                target_url: { type: string, description: Guild session url or issue/PR url }
                agent: { type: string }
      responses:
        '200':
          description: result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  repo: { type: string }
                  sha: { type: string }
                  state: { type: string }
                  context: { type: string }
  /verify:
    post:
      operationId: verify_fix
      summary: Prove a fix is right. L1 the finding is gone at head_sha and no new findings vs base_sha (Semgrep). L2 the repo's own tests pass at head_sha. L3 your regression test FAILS at base_sha and PASSES at head_sha (a test that does not fail on the vulnerable code proves nothing). Call before opening or merging a fix PR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, base_sha, head_sha, agent]
              properties:
                repo: { type: string, description: owner/name }
                base_sha: { type: string, description: vulnerable commit (main before the fix) }
                head_sha: { type: string, description: commit with the fix (fix branch head) }
                fingerprint: { type: string, description: fingerprint of the finding being fixed }
                rule_id: { type: string }
                path: { type: string }
                agent: { type: string }
                test_code: { type: string, description: "pytest file source that exercises the vulnerability benignly, e.g. hits the endpoint with a quote character and asserts 200. Must fail on base_sha, pass on head_sha." }
                test_path: { type: string, description: "where to write test_code, default tests/test_aegis_<fingerprint>.py" }
      responses:
        '200':
          description: verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyResult' }
        '404':
          description: base_sha or head_sha cannot be checked out
  /fix:
    post:
      operationId: fix_code
      summary: Write the minimal patch for ONE finding and return the full patched file + unified diff. Pass the finding's path/start_line/end_line/lines/rule_id/message and, when present, its fix and fix_hint. If the finding carries `fix` it is applied verbatim (deterministic); otherwise a model writes a replacement for exactly the flagged span following the remediation playbook (parameterised SQL, secrets to os.environ, shell=True to list args, yaml.safe_load). Everything outside the span is guaranteed byte-identical (at most one `import X` line is added). Commit new_content on branch aegis/fix-<fingerprint>, then call verify_fix. ok=false means do not commit, open an Issue instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, sha, path, start_line, end_line, lines, rule_id, message, agent]
              properties:
                repo: { type: string, description: owner/name }
                sha: { type: string, description: commit the finding was reported at (head of the push) }
                path: { type: string, description: file path from the finding }
                start_line: { type: integer, description: 1-based, from the finding }
                end_line: { type: integer, description: 1-based inclusive, from the finding }
                lines: { type: string, description: the finding's `lines` field verbatim; used to locate the span exactly }
                rule_id: { type: string }
                message: { type: string, description: the finding's message }
                fix: { type: string, description: "the finding's `fix` field if present (Semgrep rule fix). Pass it through unchanged." }
                fix_hint: { type: string, description: the finding's fix_hint if present }
                cwe: { type: string, description: e.g. CWE-89 }
                agent: { type: string, description: calling agent name }
      responses:
        '200':
          description: patch proposal; check ok before committing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixResult' }
  /insights:
    get:
      operationId: fleet_insights
      summary: Fleet-wide analytics from ClickHouse for the warden agent.
      parameters:
        - name: hours
          in: query
          schema: { type: integer, default: 24 }
      responses:
        '200':
          description: insights
          content:
            application/json:
              schema:
                type: object
                properties:
                  rising_repos: { type: array, items: { type: object } }
                  noisy_rules: { type: array, items: { type: object } }
                  reopened: { type: array, items: { type: object } }
                  agent_latency: { type: array, items: { type: object } }
                  handoffs:
                    type: object
                    description: handoff guard activity in the window
                    properties:
                      ok: { type: integer }
                      rejected: { type: integer }
                      last: { type: array, items: { type: object }, description: "last 10: {ts, from, to, kind, ok, rule_ids, repo, ref}" }
  /rules/propose:
    post:
      operationId: propose_rule
      summary: "Rule gate for learned rules. Runs `semgrep --validate` on rule_yaml, then `semgrep --test` on fixture_code with `# ruleid: <id>` lines (must match) and `# ok: <id>` lines (must not). Call BEFORE opening a rule PR; ok=false means the rule is wrong or noisy, fix it and call again (max 3 tries), never open the PR with ok=false."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule_yaml, fixture_code, agent]
              properties:
                rule_yaml: { type: string, description: "Semgrep rule file text: a `rules:` list with ONE rule" }
                fixture_code: { type: string, description: "test source in the rule's language. Put `# ruleid: <rule id>` on the line above each line that must match (the original evidence) and `# ok: <rule id>` above a safe variant that must not match" }
                fixture_path: { type: string, description: "file name whose extension picks the language, e.g. app.py or app.js (default rule.py)" }
                fixed_code: { type: string, description: "only for rules with a `fix`: the fixture after the fix is applied" }
                agent: { type: string }
      responses:
        '200':
          description: gate result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleGateResult' }
  /rules:
    get:
      operationId: list_rules
      summary: Rule ids the fleet scans with, bundled (rules/*.yml) and learned (rules/learned/*.yml), with mode (search|taint) and whether they carry a fix.
      responses:
        '200':
          description: rule inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  bundled: { type: array, items: { type: object, properties: { id: { type: string }, file: { type: string }, mode: { type: string }, has_fix: { type: boolean } } } }
                  learned: { type: array, items: { type: object, properties: { id: { type: string }, file: { type: string }, mode: { type: string }, has_fix: { type: boolean } } } }
                  n_bundled: { type: integer }
                  n_learned: { type: integer }
                  taint_ids: { type: array, items: { type: string } }
  /guard:
    post:
      operationId: guard_artifact
      summary: Handoff guard. Before you hand code, a test, a patch or a Semgrep rule to another agent (or accept one), have Semgrep validate it. kind=code|test|patch runs rules/ + p/security-audit + p/secrets on the content; kind=patch with `baseline` (the original file) reports only NEW findings; kind=rule runs `semgrep --validate` and, with `fixture`, checks the rule fires. clean=false means do not pass it on; rule_ids says why. Every call is recorded as handoff_ok / handoff_rejected with from_agent->to_agent. /fix and /verify call this guard implicitly on the patch and on test_code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, content, from_agent, to_agent]
              properties:
                kind: { type: string, enum: [code, test, patch, rule] }
                language: { type: string, description: "python | javascript | typescript | yaml | go | java | ruby | php (default python)" }
                content: { type: string, description: the artifact itself (file source, test source, patched file, or rule YAML) }
                from_agent: { type: string, description: who produced it }
                to_agent: { type: string, description: who will consume it }
                repo: { type: string, description: owner/name when the artifact belongs to a repo }
                ref: { type: string, description: path or label; used as `path` in findings }
                baseline: { type: string, description: "kind=patch: the original file, so pre-existing findings are not blamed on the patch" }
                fixture: { type: string, description: "kind=rule: code the rule must fire on" }
                fixture_language: { type: string }
      responses:
        '200':
          description: verdict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardResult' }
