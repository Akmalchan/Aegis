[project]
name = "aegis"
version = "0.1.0"
description = "AEGIS: autonomous security agents for every repo. Semgrep-powered scanner, fleet API and CLI."
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=1.10.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "openai>=3.27.0",
    "pydantic>=2.14.0",
    "pygithub>=2.10.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
aegis = "aegis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "aegis/rules"
